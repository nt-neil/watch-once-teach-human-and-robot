<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>待辦清單</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f1f5f9;
      color: #172033;
      font: 22px/1.6 system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    main {
      width: min(960px, calc(100% - 40px));
      margin: 48px auto;
      padding: 36px;
      background: #fff;
      border: 2px solid #cbd5e1;
      border-radius: 18px;
    }
    h1 { margin: 0 0 16px; font-size: 44px; line-height: 1.3; }
    label[for="item-input"] { display: block; margin-bottom: 8px; font-weight: 700; }
    .entry, .actions { display: flex; gap: 12px; }
    input[type="text"] {
      min-width: 0;
      flex: 1;
      padding: 14px 16px;
      border: 2px solid #64748b;
      border-radius: 8px;
      color: #172033;
      background: #fff;
      font: inherit;
    }
    input::placeholder { color: #526174; opacity: 1; }
    button {
      padding: 14px 22px;
      border: 2px solid #153e75;
      border-radius: 8px;
      color: #fff;
      background: #153e75;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #0b2c59; }
    #reset-button { color: #172033; border-color: #64748b; background: #fff; }
    #reset-button:hover { background: #e8eef8; }
    :focus-visible { outline: 4px solid #c2410c; outline-offset: 4px; }
    #todo-list { list-style: none; padding: 0; margin: 24px 0; }
    .item { margin: 12px 0; border: 2px solid #cbd5e1; border-radius: 8px; }
    .item label {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      cursor: pointer;
    }
    .item input { width: 28px; height: 28px; margin: 0; flex-shrink: 0; accent-color: #166534; }
    .item-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .item.completed { background: #dcfce7; border-color: #166534; color: #14532d; }
    .completed .item-text { text-decoration: line-through; text-decoration-thickness: 3px; }
    .completion { font-weight: 700; white-space: nowrap; }
    .actions { flex-wrap: wrap; }
    #status { min-height: 36px; margin: 20px 0 0; font-weight: 600; }
    @media (max-width: 600px) {
      main { margin: 20px auto; padding: 20px; }
      h1 { font-size: 36px; }
      .entry { flex-direction: column; }
      .item label { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <main>
    <h1>待辦清單</h1>
    <label for="item-input">待辦事項</label>
    <div class="entry">
      <input id="item-input" type="text" placeholder="輸入待辦事項" autocomplete="off">
      <button id="add-button" type="button">新增</button>
    </div>
    <ul id="todo-list" aria-label="待辦清單"></ul>
    <div class="actions">
      <button id="clear-completed" type="button">清除已完成</button>
      <button id="reset-button" type="button">重置</button>
    </div>
    <p id="status" role="status" aria-live="polite">目前沒有待辦事項，請輸入後按「新增」。</p>
  </main>
  <script>
    const input = document.getElementById('item-input');
    const list = document.getElementById('todo-list');
    const status = document.getElementById('status');
    const initialStatus = '目前沒有待辦事項，請輸入後按「新增」。';
    let items = [];

    function render() {
      list.replaceChildren();
      for (const item of items) {
        const row = document.createElement('li');
        row.className = item.completed ? 'item completed' : 'item';
        const label = document.createElement('label');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = item.completed;
        const text = document.createElement('span');
        text.className = 'item-text';
        text.textContent = item.text;
        const completion = document.createElement('span');
        completion.className = 'completion';
        completion.textContent = '已完成';
        completion.hidden = !item.completed;
        checkbox.addEventListener('change', () => {
          item.completed = checkbox.checked;
          row.classList.toggle('completed', item.completed);
          completion.hidden = !item.completed;
          status.textContent = item.completed ? '已標記完成。' : '已改為待完成。';
        });
        label.append(checkbox, text, completion);
        row.append(label);
        list.append(row);
      }
    }

    function addItem() {
      const text = input.value.trim();
      if (!text) {
        status.textContent = '請先輸入待辦事項。';
        input.focus();
        return;
      }
      items.push({ text, completed: false });
      render();
      input.value = '';
      status.textContent = '已新增待辦事項。';
      input.focus();
    }

    function resetAll() {
      items = [];
      input.value = '';
      render();
      status.textContent = initialStatus;
      input.focus();
    }

    document.getElementById('add-button').addEventListener('click', addItem);
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.isComposing) {
        event.preventDefault();
        addItem();
      }
    });
    document.getElementById('clear-completed').addEventListener('click', () => {
      const count = items.filter((item) => item.completed).length;
      items = items.filter((item) => !item.completed);
      render();
      status.textContent = count ? `已清除 ${count} 項已完成事項。` : '沒有已完成事項可清除。';
    });
    document.getElementById('reset-button').addEventListener('click', resetAll);
    window.addEventListener('pageshow', resetAll);
    resetAll();
  </script>
</body>
</html>
